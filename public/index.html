<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fajr Tracker</title>
<style>
  :root {
    --bg: #f5f3ee;
    --card: #ffffff;
    --text: #1c1b19;
    --text-dim: #6b6860;
    --border: #e5e1d8;
    --accent: #2f6e5e;
    --home: #3b7dd8;
    --home-soft: #e6eefc;
    --masjid: #2f9e6f;
    --masjid-soft: #e4f5ec;
    --missed: #c85a4a;
    --missed-soft: #fbe9e6;
    --pending: #cfc9ba;
    --pending-soft: #f1efe8;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a;
      --card: #212226;
      --text: #eeece6;
      --text-dim: #9a978d;
      --border: #34353a;
      --accent: #5fb79a;
      --home: #6ea3e8;
      --home-soft: #1c2734;
      --masjid: #5fc298;
      --masjid-soft: #1a2d24;
      --missed: #e08373;
      --missed-soft: #33221f;
      --pending: #4a4b50;
      --pending-soft: #26272b;
      --shadow: 0 1px 3px rgba(0,0,0,0.4);
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body { max-width: 520px; margin: 0 auto; padding: 20px 16px 48px; }
  header { text-align: center; margin-bottom: 16px; }
  header .icon { font-size: 34px; }
  header h1 { font-size: 20px; margin: 6px 0 2px; }
  header .sub { font-size: 13px; color: var(--text-dim); }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow);
  }
  .card h2 {
    font-size: 13px; margin: 0 0 12px; color: var(--text-dim);
    font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
  }

  .today-date { font-size: 13px; color: var(--text-dim); margin-bottom: 8px; }
  .today-status { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
  .btn-row { display: flex; gap: 8px; }
  .btn {
    flex: 1; padding: 13px 8px; border-radius: 12px; border: 1.5px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 14px; font-weight: 600;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(0.97); }
  .btn.home.active { background: var(--home-soft); border-color: var(--home); color: var(--home); }
  .btn.masjid.active { background: var(--masjid-soft); border-color: var(--masjid); color: var(--masjid); }
  .btn.clear { flex: 0 0 auto; padding: 13px 14px; font-size: 13px; color: var(--text-dim); }

  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { text-align: center; padding: 10px 4px; border-radius: 12px; background: var(--bg); }
  .stat .num { font-size: 20px; font-weight: 700; }
  .stat .lbl { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .stat.streak .num { color: var(--accent); }

  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--text-dim); margin-bottom: 10px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
  .dot.home { background: var(--home); }
  .dot.masjid { background: var(--masjid); }
  .dot.missed { background: var(--missed); }
  .dot.pending { background: var(--pending); }

  .month-nav {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .month-nav .month-label {
    font-size: 14px; font-weight: 700; color: var(--text);
    display: flex; flex-direction: column; align-items: center; line-height: 1.2;
  }
  .month-nav .jump-today {
    font-size: 11px; font-weight: 500; color: var(--accent);
    background: none; border: none; padding: 2px 0 0; cursor: pointer;
    text-decoration: underline; width: auto;
  }
  .nav-btn {
    width: 34px; height: 34px; flex: 0 0 auto; padding: 0;
    border-radius: 10px; border: 1.5px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 16px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .nav-btn:disabled { opacity: 0.35; cursor: default; }

  .weekday-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 4px; }
  .weekday-row span { text-align: center; font-size: 10px; color: var(--text-dim); }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day {
    aspect-ratio: 1; border-radius: 8px; background: var(--pending-soft); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--text-dim);
    cursor: pointer;
  }
  .day.empty { visibility: hidden; cursor: default; }
  .day.future { visibility: hidden; cursor: default; }
  .day.home { background: var(--home-soft); border-color: var(--home); color: var(--home); font-weight: 600; }
  .day.masjid { background: var(--masjid-soft); border-color: var(--masjid); color: var(--masjid); font-weight: 600; }
  .day.missed { background: var(--missed-soft); border-color: var(--missed); color: var(--missed); font-weight: 600; }
  .day.today { box-shadow: 0 0 0 2px var(--accent); }

  .friend-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .friend-row:last-child { border-bottom: none; }
  .friend-name { flex: 1; font-size: 14px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .friend-name.you { color: var(--accent); }
  .friend-streak { font-size: 11px; color: var(--text-dim); flex: 0 0 auto; width: 52px; text-align: right; }
  .mini-strip { display: flex; gap: 3px; flex: 0 0 auto; }
  .mini-dot { width: 9px; height: 9px; border-radius: 3px; }
  .mini-dot.home { background: var(--home); }
  .mini-dot.masjid { background: var(--masjid); }
  .mini-dot.missed { background: var(--missed); }
  .mini-dot.pending { background: var(--pending); }

  .empty-state { font-size: 13px; color: var(--text-dim); text-align: center; padding: 8px 0; }

  .popover {
    position: fixed; inset: 0; background: rgba(0,0,0,0.35);
    display: none; align-items: flex-end; justify-content: center; z-index: 50;
  }
  .popover.open { display: flex; }
  .popover-sheet { background: var(--card); width: 100%; max-width: 520px; border-radius: 18px 18px 0 0; padding: 18px 16px 26px; }
  .popover-sheet .ph { font-size: 13px; color: var(--text-dim); margin-bottom: 12px; text-align: center; }
  .popover-sheet .btn-row { margin-bottom: 8px; }
  .popover-sheet .cancel { width: 100%; margin-top: 4px; padding: 12px; border-radius: 12px; border: none; background: none; color: var(--text-dim); font-size: 14px; }

  #nameGate {
    position: fixed; inset: 0; background: var(--bg); z-index: 100;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  #nameGate .box { max-width: 360px; width: 100%; text-align: center; }
  #nameGate .icon { font-size: 40px; margin-bottom: 8px; }
  #nameGate h2 { font-size: 18px; margin: 0 0 6px; }
  #nameGate p { font-size: 13px; color: var(--text-dim); margin: 0 0 16px; }
  #nameGate input {
    width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-size: 15px; margin-bottom: 10px;
  }
  #nameGate button {
    width: 100%; padding: 13px; border-radius: 12px; border: none;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
  }

  footer { text-align: center; font-size: 11px; color: var(--text-dim); margin-top: 18px; }
  #app { display: none; }
</style>
</head>
<body>

<div id="nameGate">
  <div class="box">
    <div class="icon">🕌</div>
    <h2>Fajr Tracker</h2>
    <p>What's your name? Your friends will see it on the shared board.</p>
    <input id="gateInput" type="text" placeholder="e.g. Yusuf" maxlength="30" autofocus>
    <button id="gateSubmit">Join</button>
  </div>
</div>

<div id="app">
  <header>
    <div class="icon">🕌</div>
    <h1>Fajr Tracker</h1>
    <div class="sub" id="whoami"></div>
  </header>

  <div class="card">
    <div class="today-date" id="todayDate"></div>
    <div class="today-status" id="todayStatus">Not logged yet</div>
    <div class="btn-row">
      <button class="btn home" data-status="home">🏠 Home</button>
      <button class="btn masjid" data-status="masjid">🕌 Masjid</button>
      <button class="btn clear" id="clearToday">Clear</button>
    </div>
  </div>

  <div class="card">
    <h2>Your month</h2>
    <div class="stats-grid">
      <div class="stat streak"><div class="num" id="statStreak">0</div><div class="lbl">day streak</div></div>
      <div class="stat"><div class="num" id="statPct">—</div><div class="lbl">on time</div></div>
      <div class="stat"><div class="num" id="statMissed">0</div><div class="lbl">missed</div></div>
    </div>
  </div>

  <div class="card">
    <h2>Friends</h2>
    <div class="legend">
      <span><i class="dot home"></i>Home</span>
      <span><i class="dot masjid"></i>Masjid</span>
      <span><i class="dot missed"></i>Missed</span>
      <span><i class="dot pending"></i>Pending</span>
    </div>
    <div id="friendsList"></div>
  </div>

  <div class="card">
    <div class="month-nav">
      <button class="nav-btn" id="prevMonth" aria-label="Previous month">‹</button>
      <div class="month-label">
        <span id="monthLabel">Month Year</span>
        <button class="jump-today" id="jumpToday" style="display:none;">Jump to today</button>
      </div>
      <button class="nav-btn" id="nextMonth" aria-label="Next month">›</button>
    </div>
    <div class="weekday-row">
      <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
    </div>
    <div class="grid" id="historyGrid"></div>
  </div>

  <footer>Everyone on this link shares one board. Tap any past day to fix a log.</footer>
</div>

<div class="popover" id="popover">
  <div class="popover-sheet">
    <div class="ph" id="popoverDate"></div>
    <div class="btn-row">
      <button class="btn home" data-status="home">🏠 Home</button>
      <button class="btn masjid" data-status="masjid">🕌 Masjid</button>
    </div>
    <div class="btn-row" style="margin-top:8px;">
      <button class="btn" data-status="missed">Mark missed</button>
      <button class="btn clear" data-status="clear">Clear</button>
    </div>
    <button class="cancel" id="popoverCancel">Cancel</button>
  </div>
</div>

<script>
(function () {
  var NAME_KEY = 'fajrTracker.name.v1';
  var POLL_MS = 12000;

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function toKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function startOfDay(d) { var x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
  function slugify(name) {
    return String(name).trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'friend';
  }

  var WEEKDAYS_LONG = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  var myName = null;
  var mySlug = null;
  var state = { users: [], logs: [] };

  // Which month the calendar card is currently showing (always day 1 of that month)
  var viewDate = startOfDay(new Date());
  viewDate.setDate(1);

  // ---- API helpers ----
  function api(path, opts) {
    opts = opts || {};
    opts.headers = { 'Content-Type': 'application/json' };
    if (opts.body) opts.body = JSON.stringify(opts.body);
    return fetch(path, opts).then(function (r) {
      if (!r.ok) return r.json().then(function (e) { throw new Error(e.error || 'request failed'); });
      return r.json();
    });
  }

  function fetchState() {
    return api('/api/state').then(function (s) {
      state = s;
      render();
    }).catch(function () { /* keep last known state on transient failure */ });
  }

  function setStatus(dateKey, status) {
    return api('/api/log', { method: 'POST', body: { user: myName, date: dateKey, status: status } })
      .then(fetchState);
  }

  // ---- name gate ----
  var nameGate = document.getElementById('nameGate');
  var appEl = document.getElementById('app');
  var gateInput = document.getElementById('gateInput');
  var gateSubmit = document.getElementById('gateSubmit');

  function joinAs(name) {
    name = name.trim();
    if (!name) return;
    myName = name;
    mySlug = slugify(name);
    try { localStorage.setItem(NAME_KEY, name); } catch (e) {}
    api('/api/users', { method: 'POST', body: { user: name } }).catch(function () {});
    nameGate.style.display = 'none';
    appEl.style.display = 'block';
    document.getElementById('whoami').textContent = 'Signed in as ' + name;
    fetchState();
    setInterval(fetchState, POLL_MS);
  }

  gateSubmit.addEventListener('click', function () { joinAs(gateInput.value); });
  gateInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') joinAs(gateInput.value); });

  try {
    var saved = localStorage.getItem(NAME_KEY);
    if (saved) joinAs(saved);
  } catch (e) {}

  // ---- rendering ----
  var todayDateEl = document.getElementById('todayDate');
  var todayStatusEl = document.getElementById('todayStatus');
  var historyGrid = document.getElementById('historyGrid');
  var friendsList = document.getElementById('friendsList');
  var statStreak = document.getElementById('statStreak');
  var statPct = document.getElementById('statPct');
  var statMissed = document.getElementById('statMissed');
  var monthLabelEl = document.getElementById('monthLabel');
  var jumpTodayBtn = document.getElementById('jumpToday');
  var prevMonthBtn = document.getElementById('prevMonth');
  var nextMonthBtn = document.getElementById('nextMonth');

  function labelFor(status) {
    if (status === 'home') return '🏠 Prayed at home';
    if (status === 'masjid') return '🕌 Prayed in masjid';
    if (status === 'missed') return '✕ Missed';
    return 'Not logged yet';
  }

  function logsBySlug(slug) {
    var map = {};
    state.logs.forEach(function (l) { if (l.slug === slug) map[l.date] = l.status; });
    return map;
  }

  function computeStreak(logMap, today) {
    var streak = 0;
    var d = new Date(today);
    var todayKeyStr = toKey(today);
    while (true) {
      var key = toKey(d);
      var status = logMap[key];
      if (key === todayKeyStr && !status) { d.setDate(d.getDate() - 1); continue; }
      if (status === 'home' || status === 'masjid') { streak++; d.setDate(d.getDate() - 1); }
      else break;
    }
    return streak;
  }

  function effectiveStatus(logMap, d, today) {
    var key = toKey(d);
    var status = logMap[key];
    var isFuture = d.getTime() > today.getTime();
    var isToday = d.getTime() === today.getTime();
    if (!status && !isFuture && !isToday) return 'missed';
    return status || null;
  }

  // Stats card always reflects the real current calendar month (independent of
  // whichever month the grid below happens to be browsing).
  function computeCurrentMonthStats(logMap, today) {
    var year = today.getFullYear();
    var month = today.getMonth();
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    var good = 0, missed = 0, logged = 0;
    for (var i = 1; i <= daysInMonth; i++) {
      var d = new Date(year, month, i);
      if (d.getTime() > today.getTime()) break;
      var status = effectiveStatus(logMap, d, today);
      if (status === 'home' || status === 'masjid') { good++; logged++; }
      else if (status === 'missed') { missed++; logged++; }
    }
    return { good: good, missed: missed, logged: logged };
  }

  function isSameMonth(a, b) {
    return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth();
  }

  function renderMonthGrid(myLogs, today) {
    var year = viewDate.getFullYear();
    var month = viewDate.getMonth();

    monthLabelEl.textContent = MONTHS[month] + ' ' + year;
    var onCurrentMonth = isSameMonth(viewDate, today);
    nextMonthBtn.disabled = onCurrentMonth;
    jumpTodayBtn.style.display = onCurrentMonth ? 'none' : 'inline-block';

    var firstOfMonth = new Date(year, month, 1);
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    var leadPad = firstOfMonth.getDay();

    historyGrid.innerHTML = '';
    for (var p = 0; p < leadPad; p++) {
      var lead = document.createElement('div');
      lead.className = 'day empty';
      historyGrid.appendChild(lead);
    }

    for (var i = 1; i <= daysInMonth; i++) {
      var d = new Date(year, month, i);
      var isFuture = d.getTime() > today.getTime();
      var isToday = d.getTime() === today.getTime();
      var status = effectiveStatus(myLogs, d, today);

      var div = document.createElement('div');
      var cls = 'day';
      if (isFuture) {
        cls += ' future';
      } else {
        if (status) cls += ' ' + status;
        if (isToday) cls += ' today';
      }
      div.className = cls;
      div.textContent = i;
      if (!isFuture) {
        (function (key) { div.addEventListener('click', function () { openPopover(key, d); }); })(toKey(d));
      }
      historyGrid.appendChild(div);
    }

    var totalCells = leadPad + daysInMonth;
    var trailPad = (7 - (totalCells % 7)) % 7;
    for (var t = 0; t < trailPad; t++) {
      var trail = document.createElement('div');
      trail.className = 'day empty';
      historyGrid.appendChild(trail);
    }
  }

  function render() {
    if (!myName) return;
    var today = startOfDay(new Date());
    var tKey = toKey(today);
    var myLogs = logsBySlug(mySlug);

    todayDateEl.textContent = WEEKDAYS_LONG[today.getDay()] + ', ' + MONTHS[today.getMonth()] + ' ' + today.getDate();
    var tStatus = myLogs[tKey];
    todayStatusEl.textContent = tStatus ? labelFor(tStatus) : 'Not logged yet — becomes missed once today passes';

    document.querySelectorAll('.card .btn-row .btn.home, .card .btn-row .btn.masjid').forEach(function (b) {
      if (b.closest('.popover')) return;
      b.classList.toggle('active', b.dataset.status === tStatus);
    });

    var monthStats = computeCurrentMonthStats(myLogs, today);
    statStreak.textContent = computeStreak(myLogs, today);
    statPct.textContent = monthStats.logged ? Math.round((monthStats.good / monthStats.logged) * 100) + '%' : '—';
    statMissed.textContent = monthStats.missed;

    renderMonthGrid(myLogs, today);

    // Friends board
    var users = state.users.slice();
    if (!users.some(function (u) { return u.slug === mySlug; })) {
      users.push({ name: myName, slug: mySlug });
    }
    var rows = users.map(function (u) {
      var lm = logsBySlug(u.slug);
      var streak = computeStreak(lm, today);
      var strip = [];
      for (var k = 6; k >= 0; k--) {
        var dd = new Date(today);
        dd.setDate(dd.getDate() - k);
        strip.push(effectiveStatus(lm, dd, today) || 'pending');
      }
      return { user: u, streak: streak, strip: strip, todayStatus: lm[tKey] || 'pending' };
    });
    rows.sort(function (a, b) { return b.streak - a.streak; });

    friendsList.innerHTML = '';
    if (!rows.length) {
      var e = document.createElement('div');
      e.className = 'empty-state';
      e.textContent = 'No one has joined yet — share this link with friends.';
      friendsList.appendChild(e);
    }
    rows.forEach(function (r) {
      var row = document.createElement('div');
      row.className = 'friend-row';

      var name = document.createElement('div');
      name.className = 'friend-name' + (r.user.slug === mySlug ? ' you' : '');
      name.textContent = r.user.name + (r.user.slug === mySlug ? ' (you)' : '');

      var strip = document.createElement('div');
      strip.className = 'mini-strip';
      r.strip.forEach(function (s) {
        var dot = document.createElement('div');
        dot.className = 'mini-dot ' + s;
        strip.appendChild(dot);
      });

      var streak = document.createElement('div');
      streak.className = 'friend-streak';
      streak.textContent = r.streak + '🔥';

      row.appendChild(name);
      row.appendChild(strip);
      row.appendChild(streak);
      friendsList.appendChild(row);
    });
  }

  // today buttons
  document.querySelectorAll('#app .card .btn-row .btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      if (!myName) return;
      var today = toKey(startOfDay(new Date()));
      if (btn.id === 'clearToday') { setStatus(today, 'clear'); return; }
      setStatus(today, btn.dataset.status);
    });
  });

  // month navigation
  prevMonthBtn.addEventListener('click', function () {
    viewDate.setMonth(viewDate.getMonth() - 1);
    render();
  });
  nextMonthBtn.addEventListener('click', function () {
    if (nextMonthBtn.disabled) return;
    viewDate.setMonth(viewDate.getMonth() + 1);
    render();
  });
  jumpTodayBtn.addEventListener('click', function () {
    viewDate = startOfDay(new Date());
    viewDate.setDate(1);
    render();
  });

  // popover for past days
  var popover = document.getElementById('popover');
  var popoverDate = document.getElementById('popoverDate');
  var activeKey = null;

  function openPopover(key, date) {
    activeKey = key;
    popoverDate.textContent = WEEKDAYS_LONG[date.getDay()] + ', ' + MONTHS[date.getMonth()] + ' ' + date.getDate();
    popover.classList.add('open');
  }
  function closePopover() { popover.classList.remove('open'); activeKey = null; }

  popover.addEventListener('click', function (e) { if (e.target === popover) closePopover(); });
  document.getElementById('popoverCancel').addEventListener('click', closePopover);
  popover.querySelectorAll('.btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      if (!activeKey) return;
      setStatus(activeKey, btn.dataset.status);
      closePopover();
    });
  });
})();
</script>
</body>
</html>
